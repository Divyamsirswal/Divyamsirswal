<svg xmlns="http://www.w3.org/2000/svg" width="836" height="206" viewBox="0 0 836 206">
  <style>
    @font-face { font-family: "YS"; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "YS", Georgia, serif; font-size: 82px; letter-spacing: -2px; fill: #f0f6fc; }
    .a { animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; }
    .b { animation: rise .8s .14s cubic-bezier(.2, .7, .2, 1) both; }
    .p { fill: #b8c95a; animation: tint .7s .95s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes tint { from { fill: #f0f6fc; } }
    @media (prefers-reduced-motion: reduce) { .a, .b, .p { animation: none; } }
  </style>
  <text class="a" x="-2" y="80">I turn problems</text>
  <text class="b" x="-2" y="172">into <tspan class="p">products.</tspan></text>
</svg>
