<svg xmlns="http://www.w3.org/2000/svg" width="836" height="200" viewBox="0 0 836 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    text { font-size: 80px; font-weight: 700; letter-spacing: -3px; fill: #1f2328; }
    .a { animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; }
    .b { animation: rise .8s .14s cubic-bezier(.2, .7, .2, 1) both; }
    .p { fill: #1a7f37; animation: tint .7s .95s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes tint { from { fill: #1f2328; } }
    @media (prefers-reduced-motion: reduce) { .a, .b, .p { animation: none; } }
  </style>
  <text class="a" x="-4" y="78">I turn problems</text>
  <text class="b" x="-4" y="166">into <tspan class="p">products.</tspan></text>
</svg>
